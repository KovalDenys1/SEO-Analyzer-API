# The seo-analyzer-web site's database. PostgREST serves the same /rest/v1 protocol that
# supabase-js expects, so the site only swaps NEXT_PUBLIC_SUPABASE_URL and its key.
# Run from this directory: docker compose up -d (secrets in .env, see README.md).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wrapper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      AUTHENTICATOR_PASSWORD: ${AUTHENTICATOR_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "wrapper"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHENTICATOR_PASSWORD:?}@db:5432/wrapper
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
